<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <div style="margin-left: 30%; margin-right:30%">
    <h1>Grade Volleyball Registration Form</h1>
    <form>
        <label for="first name">Participant Name</label>
        <br>
        <input  required style="width: 243px; height: 30px;   border:2px solid purple" type="text" id="first name" placeholder="First">
        <input required style="width: 243px; height: 30px;border:2px solid purple" type="text" placeholder="Last">
        <br><br>
        <label for="age">Age</label>
        <br>
        <input required style="width: 500px;height: 30px; border:2px solid purple" type="number" id="age">
        <br><br>
        <label for="grade">Grade</label>
        <br>
        <select required style="width: 508px; height: 30px;border:2px solid purple " id="grade" >
            <option disabled selected value="">Plase select</option>
            <option value="">1</option>
            <option value="">2</option>
            <option value="">3</option>
            <option value="">4</option>
            <option value="">5</option>
            <option value="">6</option>
            <option value="">7</option>
        </select>
        <br><br>
        <label for="school">School District</label>
        <br>
        <input required style="width: 500px; height: 30px; border: 2px solid purple" type="text" id="school">
        <br><br>
        <label for="shirt Size">Shirt Size</label>
        <br>
        <select id="shirt Size" required style="width: 508px;height: 30px; border: 2px solid purple ">
            <option disabled selected value="">Please select</option>
            <option value="">l</option>
            <option value="">xl</option>
            <option value="">2xl</option>
            <option value="">3xl</option>
        </select>
        <br><br>
        <label for="parent name">Parent Name</label>
        <br>
    <input required style="width: 244p~; height: 30px; border:2px solid purple" type="text" name="" id="parent name" placeholder="First">
        <input required style="width: 245px; height: 30px; border:2px solid purple" type="text" id="" placeholder="Last">
        <br><br>
        <a style="color: blue;width: 50px;" target="_blank" href="./Index.html~">Emergency contact</a>

    </form>
   <div>
</body>
</html>
