        <br><br>
        <label for="phone num">Phone</label>
        <br>
        <input required style="width: 600px; height: 30px; border: 2px solid black;" type="tel" id="phone num" placeholder="+998">
        <br><br>
            <div style="display: inline-block;width: 140px;">
                <label for="date">Day</label>
        <br>

             <label for="month">Month</label>

        <select required style="width: 190px; height: 35px; border:2px solid black" name="" id="month">

            <option value="">October</option>

            <option value="">Desember</option>
        </select>
           </div>
           <div style="display: inline-block; width: 140px; height: 30px;">
            <label for="year">Year</label>
            <br>
            <input required style="width: 100px; height: 30px; border:2px solid black;" type="number" id="year">
           </div>
           <div style="display: inline-block; width: 100px;">
            <label for="time">Time</label>

            <input required style="width: 100px; height: 30px; border: 2px solid black;" type="time" name="" id="time">

        <br><br>

        <br><br>
        <label for="text">Additional requests</label>
        <br>

        <br><br>
        <input required type="checkbox" name="" id="">
        <label for="Chek">Yes,subscrime me to your newsletter</label>
